[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moflo"
version = "0.1.0"
description = "MoFlo: Language-Conditioned Flow Matching for Policy Mobilization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause-Clear" }

[tool.setuptools.packages.find]
include = ["moflo*", "mobipi*"]
